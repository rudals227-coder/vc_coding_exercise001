services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hometohome
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hometohome_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  db_data:
